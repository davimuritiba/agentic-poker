# Banco de dados do Agentic Poker (usado pelo serviço de autenticação).
#
#   pnpm db:up     sobe o Postgres em segundo plano
#   pnpm db:down   para o Postgres (os dados ficam no volume)
#
# A porta no seu computador é 5433 (e não 5432) para não colidir com outro Postgres local.
# Troque com POSTGRES_PORTA=xxxx e ajuste DATABASE_URL do serviço auth.
name: agentic-poker

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports:
      - '127.0.0.1:${POSTGRES_PORTA:-5433}:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poker -d poker']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dados-postgres:
